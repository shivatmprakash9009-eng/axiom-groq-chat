name: Build & Verify Axiom

on:
  push:
    branches: [main, release/axiom-v1, feature/nextjs-saas-migration, feature/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci || npm install
      - name: Lint checks
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Automated unit tests
        run: npm test
      - name: Production build
        run: npm run build

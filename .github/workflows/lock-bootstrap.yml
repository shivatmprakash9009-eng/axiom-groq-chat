name: Bootstrap npm lockfile (temporary)

on:
  push:
    branches: [fix/ci-streaming-and-runtime]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit the generated lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$(git status --short -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile with active dependencies"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "package-lock.json is already current"
          fi
